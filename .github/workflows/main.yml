name: Build JARVIS v1.5 STABLE BOOT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find JARVIS v1.5 ZIP
        run: |
          set -e

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name 'JARVIS-v1.5-STABLE-BOOT.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS-v1.5-STABLE-BOOT.zip was not found."
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Unpack JARVIS project
        run: |
          set -e

          rm -rf buildsrc
          mkdir -p buildsrc

          echo "Unpacking JARVIS ZIP..."
          unzip -q "$ZIP" -d buildsrc

          echo "Searching for Android project..."

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/buildsrc" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found inside the JARVIS ZIP."
            echo "ZIP contents:"
            find buildsrc -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "VERIFYING JARVIS PROJECT
