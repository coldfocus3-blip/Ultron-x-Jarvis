name: Build JARVIS v1.5 HOLO CORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SHOW WHAT IS IN THE REPOSITORY
      # ==========================================
      - name: Inspect repository
        run: |
          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort


      # ==========================================
      # 3. FIND OR EXTRACT THE JARVIS PROJECT
      # ==========================================
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          # First check whether the project is already extracted.
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Gradle project found in repository root."
            exit 0
          fi

          # Search for an existing Gradle project.
          FOUND_SETTINGS=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$FOUND_SETTINGS" ]; then
            echo "Gradle project already exists at:"
            echo "$(dirname "$FOUND_SETTINGS")"
            exit 0
          fi

          # If the project is inside a ZIP, extract it.
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP:"
            echo "$ZIP_FILE"

            mkdir -p jarvis-project

            unzip -o "$ZIP_FILE" -d jarvis-project

            echo ""
            echo "ZIP extracted."
            echo "Searching extracted files..."

            find jarvis-project -maxdepth 5 -type f | sort

            exit 0
          fi

          echo ""
          echo "ERROR: No Gradle project or ZIP file was found."
          echo ""
          echo "Repository contents:"
          find . -maxdepth 5 -type f | sort

          exit 1


      # ==========================================
      # 4. LOCATE THE REAL GRADLE ROOT
      # ==========================================
      - name: Locate Gradle root
        id: gradle_root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle settings file:"
          echo "$SETTINGS_FILE"

          echo "Gradle root:"
          echo "$ROOT_DIR"

          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================
      # 5. INSTALL JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 6. SET UP ANDROID SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 7. INSTALL ANDROID SDK COMPONENTS
      # ==========================================
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"

          sdkmanager "platforms;android-36"

          sdkmanager "build-tools;36.0.0"


      # ==========================================
      # 8. INSTALL GRADLE
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # ==========================================
      # 9. SHOW ANDROID PROJECT
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          PROJECT="${{ steps.gradle_root.outputs.root_dir }}"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo "Project directory:"
          echo "$PROJECT"

          echo ""
          echo "Project files:"
          find "$PROJECT" -maxdepth 4 -type f | sort


      # ==========================================
      # 10. BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.gradle_root.outputs.root_dir }}"

          echo "=========================================="
          echo "BUILDING JARVIS"
          echo "=========================================="

          cd "$PROJECT"

          echo "Working directory:"
          pwd

          echo ""
          echo "Starting Gradle..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 11. FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find . -type f -name "*.apk" -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK files found: $APK_COUNT"


      # ==========================================
      # 12. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          echo "=========================================="
          echo "APK SUCCESSFULLY CREATED"
          echo "=========================================="

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"


      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v1.5-HOLO-CORE-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error


      # ==========================================
      # 14. SUCCESS
      # ==========================================
      - name: Build complete
        run: |
          echo ""
          echo "=========================================="
          echo " JARVIS v1.5 HOLO CORE"
          echo " BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Your APK is available in:"
          echo "Actions → This workflow run → Artifacts"
